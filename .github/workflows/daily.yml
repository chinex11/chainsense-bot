name: Chainsense daily brief

on:
  schedule:
    - cron: "45 4 * * *"   # 05:45 Lagos time (GitHub uses UTC)
  workflow_dispatch: {}     # "Run workflow" button for testing

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Load config from secret (keeps your wallets private)
        env: { CFG: "${{ secrets.CHAINSENSE_CONFIG_YAML }}" }
        run: if [ -n "$CFG" ]; then printf '%s' "$CFG" > config.yaml; fi
      - uses: actions/cache/restore@v6
        with: { path: state, key: "state-daily-${{ github.run_id }}", restore-keys: "state-daily-" }
      - run: python main.py daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - uses: actions/cache/save@v6
        if: always()
        with: { path: state, key: "state-daily-${{ github.run_id }}" }
